<section id="newss" class="pad-50">
  <div class="container">
    <div class="row mb-5">
      <h2 class="styleHeader">
        <br />
        <span>News</span>
      </h2>
    </div>

    <div class="row box-shadow news-list pad-50" data-aos="fade-up" *ngFor="let item of news">
      <div class="col-sm-2">
        <img [src]="item.featured_image_src" class="img-responsive w-100" alt="ESAT UAE" />
      </div>

      <div class="col-sm-10">
        <h5>
          {{ item.title?.rendered }}
        </h5>

        <div [innerHTML]="item.excerpt?.rendered | slice: 0 : 200"></div>

        <p>
          <a (click)="goToProductDetails(item.id)">
            <b>Read More</b>
          </a>
        </p>
      </div>
    </div>
  </div>
</section>
