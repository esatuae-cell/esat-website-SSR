<section class="stories-section">
  <div class="container">
    <div class="our-story-sec">
      <!-- TOP CONTENT -->

      <div class="story-content d-block">
        <h2 class="titlt-f">
          {{ activeStory()?.year }}
        </h2>

        <div
          class="achievements-wrapper"
          [class.two-achievements]="activeStory()?.achievements?.length === 2"
        >
          <div class="achievement-box" *ngFor="let achievement of activeStory()?.achievements">
            <div class="image-box">
              <img [src]="achievement.image" [alt]="achievement.title" />
            </div>

            <div class="text-box" data-aos="fade-up">
              <h3>{{ achievement.title }}</h3>

              <p>
                {{ achievement.description }}
              </p>
            </div>
          </div>
        </div>
      </div>

      <!-- TIMELINE -->
      <div class="timeline-wrapper" data-aos="fade-up">
        <button class="nav-btn left" (click)="prev()">‹</button>

        <div class="timeline">
          <div
            class="year-item"
            *ngFor="let story of visibleStories(); let i = index"
            [class.active]="activeIndex() === startIndex() + i"
            (click)="selectYear(i)"
          >
            <span>{{ story.year }}</span>
          </div>
        </div>

        <button class="nav-btn right" (click)="next()">›</button>
      </div>
    </div>
  </div>
</section>
